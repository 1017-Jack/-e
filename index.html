<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page: #f2f6f3;
      --surface: #ffffff;
      --surface-soft: #f7f9f7;
      --text: #202923;
      --muted: #77827a;
      --placeholder: #9aa49c;
      --border: #e2e9e3;
      --accent: #367653;
      --accent-hover: #285f41;
      --on-accent: #ffffff;
      --danger: #b84d48;
      --danger-soft: #fbefee;
      --shadow: 0 18px 48px rgba(39, 66, 48, 0.09);
    }

    /* 尚未手動選擇時，依照作業系統偏好套用深色配色。 */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --page: #171c19;
        --surface: #222a25;
        --surface-soft: #1c231e;
        --text: #e8eee9;
        --muted: #a1afa5;
        --placeholder: #819087;
        --border: #39463d;
        --accent: #5bb986;
        --accent-hover: #74ca99;
        --on-accent: #142019;
        --danger: #ff8f86;
        --danger-soft: #3c2827;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      }
    }

    /* 手動選擇的深色配色會優先於作業系統偏好。 */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #171c19;
      --surface: #222a25;
      --surface-soft: #1c231e;
      --text: #e8eee9;
      --muted: #a1afa5;
      --placeholder: #819087;
      --border: #39463d;
      --accent: #5bb986;
      --accent-hover: #74ca99;
      --on-accent: #142019;
      --danger: #ff8f86;
      --danger-soft: #3c2827;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
    }

    /* 手動選擇淺色時，不受作業系統深色設定影響。 */
    :root[data-theme="light"] {
      color-scheme: light;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 72px 20px 40px;
      background: var(--page);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      padding: 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .heading-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: 1.55rem;
      line-height: 1.35;
    }

    .intro {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .btn-theme {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex: 0 0 auto;
      min-height: 40px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text);
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-theme:hover {
      border-color: var(--accent);
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .todo-input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--text);
      font: inherit;
    }

    .todo-input::placeholder {
      color: var(--placeholder);
    }

    .todo-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-add {
      padding: 0 19px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .btn-filter {
      flex: 1;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--muted);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-filter:hover {
      color: var(--text);
    }

    .btn-filter.is-active {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }

    .btn-theme:focus-visible,
    .btn-filter:focus-visible,
    .btn-add:focus-visible,
    .btn-delete:focus-visible,
    .todo-item input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .todo-item.completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .btn-delete {
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--danger);
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: var(--danger-soft);
    }

    .empty-state {
      margin: 0;
      padding: 24px 12px;
      color: var(--muted);
      text-align: center;
    }

    .app-footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 560px) {
      body {
        padding: 24px 14px;
      }

      .app {
        padding: 25px 18px;
      }

      .app-header {
        align-items: flex-start;
        gap: 10px;
      }

      h1 {
        font-size: 1.35rem;
      }

      .intro {
        font-size: 0.84rem;
      }

      .btn-theme {
        gap: 5px;
        padding: 7px 8px;
        font-size: 0.76rem;
      }
    }

    @media (max-width: 360px) {
      .todo-form {
        flex-direction: column;
      }

      .btn-add {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="heading-copy">
        <p class="eyebrow">TODAY, AT YOUR PACE</p>
        <h1>我的待辦清單</h1>
        <p class="intro">把要做的事寫下來，一次完成一件。</p>
      </div>
      <!-- 深色模式切換 -->
      <button id="theme-toggle" class="btn-theme" type="button" aria-pressed="false">
        <span id="theme-icon" aria-hidden="true">🌙</span>
        <span id="theme-label">深色模式</span>
      </button>
    </header>

    <!-- 新增待辦的表單 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項內容</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="今天要做什麼？"
        maxlength="200"
      >
      <button type="submit" class="btn-add">新增</button>
    </form>

    <!-- 篩選待辦事項 -->
    <div class="filters" role="group" aria-label="篩選待辦事項">
      <button type="button" class="btn-filter is-active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="btn-filter" data-filter="active" aria-pressed="false">未完成</button>
      <button type="button" class="btn-filter" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <section class="list-section" aria-label="待辦事項">
      <!-- 待辦項目由 JavaScript 動態產生 -->
      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項，新增一個吧!</p>
    </section>

    <footer class="app-footer">
      <span id="remaining-count" aria-live="polite">未完成:0 項</span>
    </footer>
  </main>

  <script>
    // ===== 我的待辦清單 =====
    // 待辦資料只存在目前頁面記憶體中，重新整理後會清空。

    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const remainingCount = document.getElementById('remaining-count');
    const filterButtons = document.querySelectorAll('.btn-filter');
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');

    let todos = [];
    let currentFilter = 'all';
    let manuallySelectedTheme = false;

    // 套用主題並更新切換按鈕的圖示、文字與狀態。
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const isDark = theme === 'dark';
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      themeLabel.textContent = isDark ? '淺色模式' : '深色模式';
      themeToggle.setAttribute('aria-pressed', String(isDark));
    }

    // 初始主題跟隨系統，手動切換只在目前頁面有效。
    function initializeTheme() {
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      applyTheme(systemTheme.matches ? 'dark' : 'light');

      systemTheme.addEventListener('change', (event) => {
        if (!manuallySelectedTheme) {
          applyTheme(event.matches ? 'dark' : 'light');
        }
      });
    }

    // 依照目前篩選條件取得要顯示的待辦事項。
    function getVisibleTodos() {
      if (currentFilter === 'active') {
        return todos.filter((todo) => !todo.completed);
      }
      if (currentFilter === 'completed') {
        return todos.filter((todo) => todo.completed);
      }
      return todos;
    }

    // 根據清單或篩選結果顯示合適的空狀態提示。
    function getEmptyMessage() {
      if (currentFilter === 'active') {
        return '目前沒有未完成的事項';
      }
      if (currentFilter === 'completed') {
        return '目前沒有已完成的事項';
      }
      return '還沒有任何待辦事項，新增一個吧！';
    }

    // 更新待辦清單、空狀態與整體未完成數量。
    function render() {
      const visibleTodos = getVisibleTodos();
      list.replaceChildren();

      visibleTodos.forEach((todo) => {
        const item = document.createElement('li');
        item.className = todo.completed ? 'todo-item completed' : 'todo-item';
        item.dataset.id = todo.id;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.setAttribute('aria-label', `標記「${todo.text}」為完成`);

        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'btn-delete';
        deleteButton.textContent = '刪除';
        deleteButton.setAttribute('aria-label', `刪除「${todo.text}」`);

        item.append(checkbox, text, deleteButton);
        list.append(item);
      });

      emptyState.hidden = visibleTodos.length > 0;
      emptyState.textContent = getEmptyMessage();
      const remaining = todos.filter((todo) => !todo.completed).length;
      remainingCount.textContent = `未完成:${remaining} 項`;
    }

    // 更新目前篩選條件與按鈕的選取狀態。
    function setFilter(filter) {
      currentFilter = filter;
      filterButtons.forEach((button) => {
        const isActive = button.dataset.filter === filter;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });
      render();
    }

    // 新增待辦，只保留在目前頁面中。
    function addTodo(text) {
      todos.push({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
        text,
        completed: false,
      });
      render();
    }

    // 切換指定待辦的完成狀態。
    function toggleTodo(id) {
      todos = todos.map((todo) => (
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      ));
      render();
    }

    // 刪除指定待辦。
    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      render();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addTodo(text);
      input.value = '';
      input.focus();
    });

    // 使用事件委派處理待辦的完成與刪除操作。
    list.addEventListener('click', (event) => {
      const item = event.target.closest('.todo-item');
      if (!item) return;

      if (event.target.matches('input[type="checkbox"]')) {
        toggleTodo(item.dataset.id);
      } else if (event.target.matches('.btn-delete')) {
        deleteTodo(item.dataset.id);
      }
    });

    // 篩選只改變顯示內容，不影響待辦資料。
    filterButtons.forEach((button) => {
      button.addEventListener('click', () => setFilter(button.dataset.filter));
    });

    // 手動切換主題只在目前頁面生效，不儲存選擇。
    themeToggle.addEventListener('click', () => {
      manuallySelectedTheme = true;
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
    });

    initializeTheme();
    render();
  </script>
</body>
</html>
